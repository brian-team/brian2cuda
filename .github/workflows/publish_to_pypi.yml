name: Build and publish to TestPyPI or PyPI
on: [push, pull_request]
permissions: {}

jobs:
  build:
    name: Build package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.x
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.x'
      - name: Build source tarballs and wheels
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: store distribution 📦
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packages
          path: dist

  deploy_test:
    name: Publish distribution 📦 to Test PyPI
    environment: release-test
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    if: github.ref == 'refs/heads/master' && github.repository == 'brian-team/brian2cuda'
    steps:
      - name: load distribution 📦
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages
          path: dist/
      - name: Deploy to Test PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0  # cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          repository-url: https://test.pypi.org/legacy/
  
  deploy:
    name: Publish distribution release 📦 to PyPI
    environment: release
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    if: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'brian-team/brian2cuda' }}
    steps:
      - name: load distribution 📦
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: packages
          path: dist/
      - name: Deploy to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.0  # cef221092ed1bacb1cc03d23a2d87d1d172e277b
